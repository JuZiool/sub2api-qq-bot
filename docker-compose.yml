services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: sub2api-qq-bot-napcat
    restart: unless-stopped
    environment:
      - ACCOUNT=${NAPCAT_QQ:-}
      - NAPCAT_GID=0
      - NAPCAT_UID=0
    ports:
      # WebUI，用于扫码登录与配置（首次登录用）
      - "6099:6099"
    volumes:
      # NapCat 完整运行目录：配置、插件、缓存及运行数据均保存到宿主机
      # 建议在 .env 中改为项目目录之外的绝对路径，避免重新拉取项目时丢失
      - ${NAPCAT_DATA_DIR:-./data/napcat}:/app/napcat
      # 镜像声明的匿名卷，显式改为宿主机挂载，避免配置随容器重建丢失
      - ${NAPCAT_CONFIG_DIR:-./data/napcat/config}:/app/napcat/config
      # QQNT 用户数据（登录态实际存放处，不挂载会掉登录）
      - ${QQ_DATA_DIR:-./data/qq}:/app/.config/QQ
    command:
      - -q
      - ${NAPCAT_QQ:-}

  bot:
    build: .
    container_name: sub2api-qq-bot
    restart: unless-stopped
    depends_on:
      - napcat
    env_file:
      - .env
    volumes:
      # 绑定凭证持久化（data/bindings.json）
      - ${BOT_DATA_DIR:-./data/bot}:/app/data
    environment:
      # compose 网络内直连 napcat 服务名
      - ONEBOT_WS_URL=ws://napcat:3001
    extra_hosts:
      # 容器内访问宿主机 sub2api（8080）
      - "host.docker.internal:host-gateway"
